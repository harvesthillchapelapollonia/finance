<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Church Finance</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f5d62'/%3E%3Cpath d='M30 10h4v12h12v4H34v28h-4V26H18v-4h12z' fill='%23f2d58f'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f3ee; --card:#ffffff; --ink:#1f2933; --muted:#677280; --line:#e4e0d6; --soft:#faf8f3;
  --accent:#0b4a33; --accent-ink:#ffffff; --gold:#f0a30a;
  --inc:#1f7a52; --exp:#c0603f; --tithe:#5b6bbf; --momo:#e0a020; --cash:#1f7a52;
  --good:#1f7a52; --bad:#b84a2e; --warn-bg:#fff4dc; --warn-line:#ecd08a;
  --shadow:0 1px 2px rgba(31,41,51,.06),0 4px 14px rgba(31,41,51,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14181a; --card:#1c2225; --ink:#e8ece9; --muted:#9aa5a0; --line:#2c3538; --soft:#192023;
    --accent:#0f5a3e; --accent-ink:#ffffff; --gold:#f5b83a;
    --inc:#5fc08f; --exp:#e0805e; --tithe:#8c9be0; --momo:#f0b84a; --cash:#5fc08f;
    --good:#5fc08f; --bad:#ec8d6e; --warn-bg:#33291a; --warn-line:#6b5524;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#14181a; --card:#1c2225; --ink:#e8ece9; --muted:#9aa5a0; --line:#2c3538; --soft:#192023;
  --accent:#0f5a3e; --accent-ink:#ffffff; --gold:#f5b83a;
  --inc:#5fc08f; --exp:#e0805e; --tithe:#8c9be0; --momo:#f0b84a; --cash:#5fc08f;
  --good:#5fc08f; --bad:#ec8d6e; --warn-bg:#33291a; --warn-line:#6b5524; --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{background:var(--accent);color:var(--accent-ink)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:52px;height:46px;border-radius:12px;background:#fff;display:grid;place-items:center;flex:none;padding:3px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.brand .mark img{width:100%;height:100%;object-fit:contain;display:block;border-radius:8px}
.brand h1{font-size:18px;font-weight:650;letter-spacing:.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand small{display:block;opacity:.8;font-size:12px;font-weight:400}
nav.tabs{background:var(--accent);position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.12)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;padding-bottom:0;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;color:var(--accent-ink);opacity:.78;padding:10px 14px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;font-weight:550}
nav.tabs button:hover{opacity:1}
nav.tabs button.on{opacity:1;border-bottom-color:var(--gold)}
main{padding:20px 0 60px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.page-head h2{font-size:22px}
.page-head p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:550;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.small{padding:4px 10px;min-height:30px;font-size:13px}
header.top .btn{background:rgba(255,255,255,.14);color:var(--accent-ink);border-color:rgba(255,255,255,.4)}
header.top .btn:hover{background:rgba(255,255,255,.24);border-color:#fff}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav.tabs button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(185px,1fr));margin-bottom:14px}
.kpi .l{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.kpi .v{font-size:23px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi.good .v{color:var(--good)} .kpi.bad .v{color:var(--bad)}
.charts{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.chartbox h3{font-size:15px;margin-bottom:10px}
.chartbox .cv{position:relative;height:260px}
.empty{color:var(--muted);text-align:center;padding:26px 10px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.filters label{font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
select,input[type=text],input[type=number],input[type=date],input[type=search],textarea{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:38px;width:100%}
.filters select,.filters input{width:auto;min-width:120px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--soft);font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:700;background:var(--soft);border-top:2px solid var(--line)}
td.desc{min-width:180px;max-width:360px;white-space:pre-wrap;overflow-wrap:anywhere}
td.act{white-space:nowrap;text-align:right}
td.nw{white-space:nowrap}
.neg{color:var(--bad)} .pos{color:var(--good)} .dim{color:var(--muted)}
tr.zero td{color:var(--muted)}
.note{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:12px;padding:11px 14px;margin-bottom:14px;font-size:14px}
.insights{margin:0;padding-left:18px} .insights li{margin:4px 0}
.cols2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.form{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.form .full{grid-column:1/-1}
.form label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:3px}
.form .total{font-weight:700;padding:8px 0}
.modal-bg{position:fixed;inset:0;background:rgba(15,20,22,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:50}
.modal-bg.show{display:flex}
.modal{background:var(--card);border-radius:16px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.modal h3{font-size:18px;margin-bottom:12px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1f2933;color:#fff;padding:10px 16px;border-radius:10px;display:none;gap:14px;align-items:center;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:92vw}
.toast.show{display:flex}
.toast button{background:none;border:0;color:#f2d58f;font-weight:700;cursor:pointer}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
.help{font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sec{margin-top:18px}
.sec>h3{font-size:16px;margin-bottom:8px}
@media (max-width:560px){
  .form{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi .v{font-size:18px}
  .kpi{padding:12px}
  th,td{padding:8px 9px}
  .chartbox .cv{height:230px}
}
.print-head{display:none}
.hero-logo{display:block;margin:0 auto 10px;width:190px;max-width:60%;height:auto;border-radius:14px}
@media print{td,th{white-space:nowrap}td.wrap{white-space:normal}
  .print-head{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid #0b4a33}
  .print-head img{height:70px;width:auto}
  .print-head b{font-size:18px;display:block}
  header.top,nav.tabs,.no-print,.toast{display:none!important}
  body{background:#fff;color:#000}
  .card,.table-wrap{box-shadow:none;border-color:#bbb}
  main{padding:0}
}

/* ---- login ---- */
.lock{position:fixed;inset:0;z-index:9999;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}
html.locked .lock,.lock.show{display:flex}
html.locked header.top,html.locked nav.tabs,html.locked main,html.locked .toast,html.locked .modal-bg{display:none!important}
.lock .box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:26px 22px}
.lock .box img{display:block;margin:0 auto 10px;max-width:150px;height:auto}
.lock h2{margin:0 0 4px;text-align:center;font-size:20px}
.lock p.sub{margin:0 0 16px;text-align:center;color:var(--muted);font-size:13.5px}
.lock label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
.lock input[type=text],.lock input[type=password]{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--soft);color:var(--ink);font-size:16px}
.lock .btn{width:100%;margin-top:16px}
.lock .err{color:#b3261e;font-size:13px;min-height:18px;margin-top:10px;text-align:center}
.lock .lnk{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;display:block;margin:12px auto 0;font-size:13px}
@media print{.lock{display:none!important}html.locked body{display:none}}
</style>

  </div>
</header>
<nav class="tabs" aria-label="Sections"><div class="wrap" id="tabs"></div></nav>
<main><div class="wrap" id="app"></div></main>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>

const KEY='church_finance_v1';
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DEFAULT_LISTS={service:['Sunday service','Friday Service','Other Services','Non service'],incomeType:['Offering','Offering + Tithe','Other'],category:['Honourarium','Welfare / Support','Church supplies','Evangelism','Sound / Equipment','Other'],method:['Cash','Mobile Money','Bank']};
let DB=load();
let ui={page:'dashboard',dash:{year:'all',month:'all',week:'all',type:'all'},inc:{year:'all',month:'all',q:''},tit:{year:'all',month:'all',q:''},exp:{year:'all',month:'all',q:''},sum:{year:'all'},mon:{year:'all'}};
let charts=[], lastDeleted=null, toastTimer=null;

/* ---------- storage ---------- */
function blank(){return {v:1,settings:{church:'The Harvest Hill Chapel',currency:'GHS',openingBalance:0,lastBackup:null,lists:JSON.parse(JSON.stringify(DEFAULT_LISTS))},income:[],tithe:[],expenses:[]}}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);const b=blank();return {...b,...d,settings:{...b.settings,...(d.settings||{}),lists:{...b.settings.lists,...((d.settings||{}).lists||{})}}}}}catch(e){console.warn('load failed',e)}
  return blank();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));return true}catch(e){alert('Could not save in this browser (storage may be full or blocked). Please export a backup now.');return false}}

/* ---------- helpers ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=typeof v==='number'?v:parseFloat(String(v??'').replace(/,/g,''));return Number.isFinite(n)?n:0};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,9));
const money=n=>(DB.settings.currency||'GHS')+' '+new Intl.NumberFormat('en-GH',{minimumFractionDigits:2,maximumFractionDigits:2}).format(r2(n));
const plain=n=>new Intl.NumberFormat('en-GH',{minimumFractionDigits:2,maximumFractionDigits:2}).format(r2(n));
const todayIso=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDate=iso=>{if(!iso)return '';const [y,m,d]=iso.split('-');return `${+d} ${MONTHS[+m-1].slice(0,3)} ${y}`};
const utc=iso=>{const [y,m,d]=iso.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const isoOf=d=>d.toISOString().slice(0,10);
/* Excel WEEKNUM(date,1): week 1 contains 1 January; weeks run Sunday to Saturday */
function weekNum(iso){const d=utc(iso),y=d.getUTCFullYear(),j=new Date(Date.UTC(y,0,1)),doy=Math.round((d-j)/864e5);return Math.floor((doy+j.getUTCDay())/7)+1}
function weeksInYear(y){return weekNum(y+'-12-31')}
function weekRange(y,w){const j=new Date(Date.UTC(y,0,1));let s=new Date(j.getTime()+((w-1)*7-j.getUTCDay())*864e5),e=new Date(s.getTime()+6*864e5);if(s<j)s=j;const dec=new Date(Date.UTC(y,11,31));if(e>dec)e=dec;return [isoOf(s),isoOf(e)]}
function short(iso){const [,m,d]=iso.split('-');return `${+d} ${MONTHS[+m-1].slice(0,3)}`}
function toIso(v){
  if(v==null||v==='')return '';
  if(v instanceof Date&&!isNaN(v))return isoOf(new Date(Date.UTC(v.getFullYear(),v.getMonth(),v.getDate())));
  if(typeof v==='number'&&v>20000&&v<80000)return isoOf(new Date(Math.round((v-25569)*864e5)));
  const s=String(v).trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  if((m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/)))return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  const t=Date.parse(s+' UTC');if(!isNaN(t))return isoOf(new Date(t));
  return '';
}
function normMethod(v){const s=String(v||'').trim();if(!s)return '';const l=s.toLowerCase().replace(/\s+/g,' ');if(['momo','mobile money','mobilemoney','mtn momo','mtn','momo pay'].includes(l))return 'Mobile Money';if(l==='cash')return 'Cash';if(l==='bank'||l==='bank transfer')return 'Bank';return s}
/* merge spelling variants that differ only by capital letters / spacing (e.g. "other" and "Other") */
function canonMap(values){const best={};values.forEach(v=>{const t=String(v||'').trim().replace(/\s+/g,' ');if(!t)return;const k=t.toLowerCase();if(!best[k]||(/^[A-Z]/.test(t)&&!/^[A-Z]/.test(best[k])))best[k]=t});return v=>{const t=String(v||'').trim().replace(/\s+/g,' ');if(!t)return '';const b=best[t.toLowerCase()]||t;return b.charAt(0).toUpperCase()+b.slice(1)}}

/* ---------- derived rows ---------- */
function incRows(){return DB.income.map(r=>({...r,total:r2(num(r.tithe)+num(r.cash)+num(r.momo)),y:+r.date.slice(0,4),m:+r.date.slice(5,7),w:weekNum(r.date)}))}
function expRows(){return DB.expenses.map(r=>({...r,total:r2(num(r.amount)),y:+r.date.slice(0,4),m:+r.date.slice(5,7),w:weekNum(r.date)}))}
function titRows(){return DB.tithe.map(r=>({...r,y:+r.date.slice(0,4),m:+r.date.slice(5,7)}))}
const sum=(a,f)=>r2(a.reduce((s,x)=>s+f(x),0));
function years(){const s=new Set();[...DB.income,...DB.expenses,...DB.tithe].forEach(r=>r.date&&s.add(+r.date.slice(0,4)));return [...s].sort((a,b)=>a-b)}
function allDates(){return [...DB.income,...DB.expenses].map(r=>r.date).filter(Boolean).sort()}

/* ---------- weekly + monthly summaries (match the workbook's SUMIFS logic) ---------- */
function buildWeeks(){
  const ds=allDates(); if(!ds.length)return [];
  const inc=incRows(),exp=expRows(),I={},E={};
  inc.forEach(r=>{const k=r.y+'-'+r.w;I[k]=(I[k]||0)+r.total});exp.forEach(r=>{const k=r.y+'-'+r.w;E[k]=(E[k]||0)+r.total});
  let y=+ds[0].slice(0,4),w=weekNum(ds[0]);const ly=+ds[ds.length-1].slice(0,4),lw=weekNum(ds[ds.length-1]);
  let bal=num(DB.settings.openingBalance);const out=[];
  for(let guard=0;guard<2000;guard++){
    const k=y+'-'+w,i=r2(I[k]||0),e=r2(E[k]||0),open=r2(bal);bal=r2(bal+i-e);
    const [s,en]=weekRange(y,w);out.push({y,w,start:s,end:en,open,income:i,expenses:e,net:r2(i-e),close:bal});
    if(y===ly&&w===lw)break; if(w>=weeksInYear(y)){y++;w=1}else w++;
  }
  return out;
}
function buildMonths(){
  const ys=years().filter(y=>DB.income.some(r=>+r.date.slice(0,4)===y)||DB.expenses.some(r=>+r.date.slice(0,4)===y)); if(!ys.length)return [];
  const inc=incRows(),exp=expRows();let bal=num(DB.settings.openingBalance);const out=[];
  for(let y=ys[0];y<=ys[ys.length-1];y++)for(let m=1;m<=12;m++){
    const i=sum(inc.filter(r=>r.y===y&&r.m===m),r=>r.total),e=sum(exp.filter(r=>r.y===y&&r.m===m),r=>r.total),open=bal;bal=r2(bal+i-e);
    out.push({y,m,open:r2(open),income:i,expenses:e,net:r2(i-e),close:bal});
  }
  return out;
}

function backupBanner(){

  return {inc,exp};
}
function pDash(){
  const f=ui.dash,{inc,exp}=dashSel();
  const ti=sum(inc,r=>r.total),te=sum(exp,r=>r.total),net=r2(ti-te),ratio=ti>0?te/ti*100:null;
  const cut=[...inc,...exp].map(r=>r.date).sort().pop();
  const balance=cut?r2(num(DB.settings.openingBalance)+sum(incRows().filter(r=>r.date<=cut),r=>r.total)-sum(expRows().filter(r=>r.date<=cut),r=>r.total)):r2(num(DB.settings.openingBalance));
  const base=incRows().filter(r=>(f.year==='all'||r.y==f.year)&&(f.month==='all'||r.m==f.month));
  const weekSet=[...new Set([...base.map(r=>r.w),...expRows().filter(r=>(f.year==='all'||r.y==f.year)&&(f.month==='all'||r.m==f.month)).map(r=>r.w)])].sort((a,b)=>a-b);

    <div><label for="ft">Income type</label><select id="ft" data-f="dash.type"><option value="all">All types</option>${types.map(t=>`<option value="${esc(t)}" ${f.type===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
    <button class="btn" data-act="resetDash">Clear filters</button>
  </div>
  ${empty?`<div class="card empty"><img class="hero-logo" src="${LOGO_FULL}" alt="The Harvest Hill Chapel logo"><h3 style="margin-bottom:6px">No records yet</h3><p>Add income and expenses, or import your existing Excel workbook.</p><div class="row" style="justify-content:center;margin-top:12px"><button class="btn primary" data-act="addIncome">Add income</button><button class="btn" data-act="addExpense">Add expense</button><button class="btn" data-go="data">Import from Excel</button></div></div>`:`
  <div class="grid kpis">
    <div class="card kpi"><div class="l">Total income</div><div class="v">${money(ti)}</div><div class="s">${inc.length} record${inc.length!==1?'s':''}</div></div>
    <div class="card kpi"><div class="l">Total expenses</div><div class="v">${money(te)}</div><div class="s">${exp.length} record${exp.length!==1?'s':''}</div></div>
    <div class="card kpi ${net<0?'bad':'good'}"><div class="l">Net (income − expenses)</div><div class="v">${net<0?'−':''}${money(Math.abs(net))}</div><div class="s">${net<0?'Deficit':'Surplus'}</div></div>
    <div class="card kpi ${ratio!=null&&ratio>100?'bad':''}"><div class="l">Expense-to-income ratio</div><div class="v">${ratio==null?'—':ratio.toFixed(0)+'%'}</div><div class="s">${ratio==null?'No income in this view':ratio>100?'Spending is above income':'Spending is within income'}</div></div>
    <div class="card kpi"><div class="l">Account balance</div><div class="v">${money(balance)}</div><div class="s">${cut?'As at '+fmtDate(cut):'Opening balance'}</div></div>
  </div>
  <div class="card sec" style="margin-top:0;margin-bottom:14px"><h3 style="font-size:16px;margin-bottom:6px">Insights</h3>${insightsHtml(inc,exp,ti,te)}</div>
  <div class="grid charts">
    <div class="card chartbox"><h3>Income by week</h3><div class="cv"><canvas id="c1"></canvas></div></div>
    <div class="card chartbox"><h3>Income by month</h3><div class="cv"><canvas id="c2"></canvas></div></div>
    <div class="card chartbox"><h3>Income vs expenses by month</h3><div class="cv"><canvas id="c3"></canvas></div></div>
    <div class="card chartbox"><h3>Expenses by month</h3><div class="cv"><canvas id="c4"></canvas></div></div>
    <div class="card chartbox"><h3>Tithe, cash and mobile money by month</h3><div class="cv"><canvas id="c5"></canvas></div></div>
    <div class="card chartbox"><h3>Expenses by category</h3><div class="cv"><canvas id="c6"></canvas></div></div>
  </div>`}`;
}
function insightsHtml(inc,exp,ti,te){
  const L=[];
  if(!inc.length&&!exp.length)return '<p class="help">Nothing to analyse for this selection.</p>';
  if(ti>0||te>0){const d=r2(ti-te);L.push(d>=0?`Income was ${money(d)} more than spending${ti>0?` (spending was ${(te/ti*100).toFixed(0)}% of income)`:''}.`:`Spending was ${money(-d)} more than income${ti>0?` (${(te/ti*100).toFixed(0)}% of income)`:''}.`)}
  const wk={};inc.forEach(r=>{const k=r.y+'|'+r.w;wk[k]=(wk[k]||0)+r.total});const best=Object.entries(wk).sort((a,b)=>b[1]-a[1])[0];
  if(best){const [y,w]=best[0].split('|'),[s,e]=weekRange(+y,+w);L.push(`Best income week: week ${w} of ${y} (${short(s)} – ${short(e)}) with ${money(best[1])}.`)}
  const cat={};exp.forEach(r=>{const k=r.category||'Uncategorised';cat[k]=(cat[k]||0)+r.total});const top=Object.entries(cat).sort((a,b)=>b[1]-a[1])[0];
  if(top&&te>0)L.push(`Biggest spending area: ${top[0]} — ${money(top[1])} (${(top[1]/te*100).toFixed(0)}% of expenses).`);
  const t=sum(inc,r=>num(r.tithe)),c=sum(inc,r=>num(r.cash)),m=sum(inc,r=>num(r.momo));
  if(ti>0&&(c+m)>0)L.push(`Mobile money made up ${(m/(c+m)*100).toFixed(0)}% of offerings received (cash ${money(c)}, mobile money ${money(m)}).`);
  if(t>0)L.push(`${money(t)} was recorded in the Tithe column of the income sheet.`);
  return '<ul class="insights">'+L.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>';
}
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function drawCharts(){
  if(typeof Chart==='undefined'){document.querySelectorAll('.chartbox .cv').forEach(c=>c.innerHTML='<p class="empty">Charts could not load (check your internet connection).</p>');return}
  const {inc,exp}=dashSel(),ink=cssv('--ink'),muted=cssv('--muted'),line=cssv('--line');
  Chart.defaults.color=muted;Chart.defaults.borderColor=line;Chart.defaults.font.family='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  const cI=cssv('--inc'),cE=cssv('--exp'),cT=cssv('--tithe'),cM=cssv('--momo'),cC=cssv('--cash'),gold=cssv('--gold');
  const pal=[cI,cE,cT,cM,'#7a9bb5','#a67bb0','#8aa05a','#c58b8b'];
  const yTick=v=>v>=1000?(v/1000)+'k':v, tip={callbacks:{label:c=>`${c.dataset.label?c.dataset.label+': ':''}${plain(c.parsed.y??c.parsed)}`}};
  const mk=(id,cfg)=>{const el=document.getElementById(id);if(el)charts.push(new Chart(el,cfg))};
  const mm=k=>[...new Set(k)].sort((a,b)=>a-b);
  // weeks
  const wkKeys=[...new Set(inc.map(r=>r.y+'-'+String(r.w).padStart(2,'0')))].sort();
  mk('c1',{type:'line',data:{labels:wkKeys.map(k=>'Wk '+(+k.split('-')[1])+(years().length>1?' ’'+k.slice(2,4):'')),datasets:[{label:'Income',data:wkKeys.map(k=>sum(inc.filter(r=>r.y+'-'+String(r.w).padStart(2,'0')===k),r=>r.total)),borderColor:cI,backgroundColor:cI+'33',fill:true,tension:.25,pointRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:tip},scales:{y:{beginAtZero:true,ticks:{callback:yTick}}}}});
  // months
  const mkeys=[...new Set([...inc,...exp].map(r=>r.y*100+r.m))].sort((a,b)=>a-b),mlab=k=>MONTHS[(k%100)-1].slice(0,3)+(years().length>1?' ’'+String(Math.floor(k/100)).slice(2):'');
  const mi=mkeys.map(k=>sum(inc.filter(r=>r.y*100+r.m===k),r=>r.total)),me=mkeys.map(k=>sum(exp.filter(r=>r.y*100+r.m===k),r=>r.total));
  mk('c2',{type:'bar',data:{labels:mkeys.map(mlab),datasets:[{label:'Income',data:mi,backgroundColor:cI,borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:tip},scales:{y:{beginAtZero:true,ticks:{callback:yTick}}}}});
  mk('c3',{type:'bar',data:{labels:mkeys.map(mlab),datasets:[{label:'Expenses',data:me,backgroundColor:cE,borderRadius:4},{label:'Income',data:mi,backgroundColor:cI,borderRadius:4}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${plain(c.parsed.x)}`}}},scales:{x:{beginAtZero:true,ticks:{callback:yTick}}}}});
  // expenses by month (pie)
  const pm=mkeys.filter((k,i)=>me[i]>0);
  mk('c4',{type:'pie',data:{labels:pm.map(mlab),datasets:[{data:pm.map(k=>me[mkeys.indexOf(k)]),backgroundColor:pm.map((k,i)=>pal[i%pal.length]),borderColor:cssv('--card'),borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right'},tooltip:{callbacks:{label:c=>`${c.label}: ${plain(c.parsed)}`}}}}});
  // channels by month (stacked)
  const ch=f=>mkeys.map(k=>sum(inc.filter(r=>r.y*100+r.m===k),f));
  mk('c5',{type:'bar',data:{labels:mkeys.map(mlab),datasets:[{label:'Tithe',data:ch(r=>num(r.tithe)),backgroundColor:cT},{label:'Cash',data:ch(r=>num(r.cash)),backgroundColor:cC},{label:'Mobile money',data:ch(r=>num(r.momo)),backgroundColor:cM}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'},tooltip:tip},scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true,ticks:{callback:yTick}}}}});
  // expenses by category
  const cat={};exp.forEach(r=>{const k=r.category||'Uncategorised';cat[k]=(cat[k]||0)+r.total});const ce=Object.entries(cat).sort((a,b)=>b[1]-a[1]);
  mk('c6',{type:'doughnut',data:{labels:ce.map(x=>x[0]),datasets:[{data:ce.map(x=>r2(x[1])),backgroundColor:ce.map((x,i)=>pal[i%pal.length]),borderColor:cssv('--card'),borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right'},tooltip:{callbacks:{label:c=>`${c.label}: ${plain(c.parsed)}`}}}}});
  document.querySelectorAll('.chartbox').forEach(b=>{const cv=b.querySelector('canvas');if(!cv)return;const ch=Chart.getChart(cv);if(ch&&!ch.data.datasets.some(d=>d.data.some(v=>v>0))){b.querySelector('.cv').innerHTML='<p class="empty">No data for this selection.</p>'}});
}

  const tot=sum(rows,r=>num(r.amount));
  const by={};rows.forEach(r=>{const k=(r.member||'(no name)').trim();by[k]=by[k]||{n:0,t:0};by[k].n++;by[k].t+=num(r.amount)});
  const members=Object.entries(by).sort((a,b)=>b[1].t-a[1].t);
  return `<div class="page-head"><div><h2>Tithe</h2><p>Member-by-member tithe register. As in the workbook, this register is kept separately and is not added to the income totals.</p></div><button class="btn primary" data-act="addTithe">+ Add tithe</button></div>

  </tbody>${rows.length?`<tfoot><tr><td colspan="2">Total (${rows.length})</td><td class="n">${plain(tot)}</td><td colspan="4"></td></tr></tfoot>`:''}</table></div>
  ${members.length>1?`<div class="sec"><h3>By member</h3><div class="table-wrap"><table><thead><tr><th>Member</th><th class="n">Payments</th><th class="n">Total</th></tr></thead><tbody>${members.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v.n}</td><td class="n">${plain(v.t)}</td></tr>`).join('')}</tbody></table></div></div>`:''}`;

function serial(iso){return Math.round((utc(iso)-Date.UTC(1899,11,30))/864e5)}

/* ---------- import ---------- */
const hnorm=s=>String(s??'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
function findCols(rows,must){ // locate header row (within first 10 rows) containing 'date'
  for(let i=0;i<Math.min(rows.length,10);i++){const h=(rows[i]||[]).map(hnorm);if(h.includes(must))return {at:i,h}}
  return null;
}
function pick(h,...names){for(const n of names){const i=h.indexOf(n);if(i>=0)return i}return -1}
function parseWorkbook(wb){
  const out={income:[],tithe:[],expenses:[],found:[]};
  const sh=n=>{const k=wb.SheetNames.find(x=>hnorm(x)===n||hnorm(x)===n+'s');return k?wb.Sheets[k]:null};
  const grid=ws=>XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:false});
  let ws=sh('income');
  if(ws){const g=grid(ws),hd=findCols(g,'date');if(hd){const h=hd.h,ci={date:pick(h,'date'),service:pick(h,'service type','service'),type:pick(h,'income type','type'),desc:pick(h,'description'),tithe:pick(h,'tithe'),cash:pick(h,'cash'),momo:pick(h,'momo','mobile money')};
    g.slice(hd.at+1).forEach(r=>{const date=toIso(r[ci.date]);if(!date)return;const t=num(r[ci.tithe]),c=num(r[ci.cash]),m=num(r[ci.momo]),d=String(r[ci.desc]??'').trim();if(t+c+m<=0&&!d)return;
      out.income.push({date,service:String(r[ci.service]??'').trim(),type:String(r[ci.type]??'').trim(),desc:d,tithe:r2(t),cash:r2(c),momo:r2(m)})});out.found.push('Income')}}
  ws=sh('tithe');
  if(ws){const g=grid(ws),hd=findCols(g,'date');if(hd){const h=hd.h,ci={date:pick(h,'date'),member:pick(h,'member name','member','name'),amount:pick(h,'amount ghs','amount','total'),method:pick(h,'payment method','method'),recv:pick(h,'received by'),rem:pick(h,'remarks','remark','notes')};
    g.slice(hd.at+1).forEach(r=>{const date=toIso(r[ci.date]);if(!date)return;const a=num(r[ci.amount]);if(a<=0&&!String(r[ci.member]??'').trim())return;
      out.tithe.push({date,member:String(r[ci.member]??'').trim(),amount:r2(a),method:normMethod(r[ci.method]),receivedBy:String(r[ci.recv]??'').trim(),remarks:String(r[ci.rem]??'').trim()})});out.found.push('Tithe')}}
  ws=sh('expense');
  if(ws){const g=grid(ws),hd=findCols(g,'date');if(hd){const h=hd.h,ci={date:pick(h,'date'),cat:pick(h,'expense category','category'),desc:pick(h,'description'),method:pick(h,'payment method','method'),amt:pick(h,'total ghs','total','amount')};
    g.slice(hd.at+1).forEach(r=>{const date=toIso(r[ci.date]);if(!date)return;const a=num(r[ci.amt]);if(a<=0)return;
      out.expenses.push({date,category:String(r[ci.cat]??'').trim(),desc:String(r[ci.desc]??'').trim(),method:normMethod(r[ci.method]),amount:r2(a)})});out.found.push('Expenses')}}
  return out;
}
function tidy(parsed){
  const svc=canonMap(parsed.income.map(r=>r.service)),typ=canonMap(parsed.income.map(r=>r.type)),cat=canonMap(parsed.expenses.map(r=>r.category));
  parsed.income.forEach(r=>{r.service=svc(r.service);r.type=typ(r.type)});parsed.expenses.forEach(r=>{r.category=cat(r.category)});
  return parsed;
}
document.addEventListener('change',e=>{
  if(e.target.id!=='importFile'||!e.target.files[0])return;
  const file=e.target.files[0];e.target.value='';
  const rd=new FileReader();
  rd.onerror=()=>alert('Could not read that file.');
  if(/\.json$/i.test(file.name)){
    rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||!Array.isArray(d.income)||!Array.isArray(d.expenses))throw 0;confirmImport({income:d.income,tithe:d.tithe||[],expenses:d.expenses,found:['Backup file'],settings:d.settings})}catch(x){alert('That does not look like a backup file from this app.')}};
    rd.readAsText(file);
  }else{
    if(typeof XLSX==='undefined')return alert('The Excel reader could not load. Check your internet connection and try again.');
    rd.onload=()=>{try{const wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});const p=tidy(parseWorkbook(wb));
      if(!p.found.length)return alert('No Income, Tithe or Expenses sheet with a Date column was found in that file.');confirmImport(p)}catch(x){console.error(x);alert('Could not read that Excel file.')}};
    rd.readAsArrayBuffer(file);
  }
});
function confirmImport(p){
  window._imp=p;
  openModal(`<h3>Import records</h3><p>Found <b>${p.income.length}</b> income, <b>${p.tithe.length}</b> tithe and <b>${p.expenses.length}</b> expense records${p.found.length?` (${esc(p.found.join(', '))})`:''}.</p>
  <p class="help">Spelling that only differed by capital letters (for example “other” and “Other”) is merged, and “Momo” is shown as “Mobile Money”. Amounts and dates are not changed.</p>
  <div class="form"><div class="full"><label><input type="radio" name="mode" value="add" checked> Add to my current records (skips exact duplicates)</label></div>
  <div class="full"><label><input type="radio" name="mode" value="replace"> Replace everything with this file</label></div></div>
  <div class="modal-actions"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="doImport">Import</button></div>`);
}
function doImport(){
  const p=window._imp;if(!p)return;const mode=(document.querySelector('input[name=mode]:checked')||{}).value||'add';
  const sig={income:r=>[r.date,r.service,r.type,r.desc,r2(num(r.tithe)),r2(num(r.cash)),r2(num(r.momo))].join('|'),tithe:r=>[r.date,r.member,r2(num(r.amount)),r.method].join('|'),expenses:r=>[r.date,r.category,r.desc,r2(num(r.amount))].join('|')};
  if(mode==='replace'){DB.income=[];DB.tithe=[];DB.expenses=[]}
  let added=0,skipped=0;
  [['income','income'],['tithe','tithe'],['expenses','expenses']].forEach(([k])=>{const have=new Set(DB[k].map(sig[k]));(p[k]||[]).forEach(r=>{const s=sig[k](r);if(have.has(s)){skipped++;return}have.add(s);DB[k].push({...r,id:r.id&&mode==='replace'?r.id:uid()});added++})});
  DB.income.forEach(r=>{addToList('service',r.service);addToList('incomeType',r.type)});DB.expenses.forEach(r=>{addToList('category',r.category);addToList('method',r.method)});
  if(p.settings&&mode==='replace'){const s=p.settings;if(s.church)DB.settings.church=s.church;if(s.currency)DB.settings.currency=s.currency;if(s.openingBalance!=null)DB.settings.openingBalance=num(s.openingBalance)}
  if(save()){closeModal();ui.page='dashboard';render();toast(`Imported ${added} record${added!==1?'s':''}${skipped?` (${skipped} duplicate${skipped!==1?'s':''} skipped)`:''}`)}
}

/* ---------- events ---------- */
function del(kind,id,label){
  const arr=DB[kind],i=arr.findIndex(x=>x.id===id);if(i<0)return;
  if(!confirm(`Delete this ${label}? You can undo right after.`))return;
  const [rec]=arr.splice(i,1);lastDeleted={kind,rec,i};save();render();
  toast(label.charAt(0).toUpperCase()+label.slice(1)+' deleted',()=>{DB[kind].splice(Math.min(i,DB[kind].length),0,rec);save();render()});
}

  ({addIncome:()=>incomeForm(),editIncome:()=>incomeForm(id),delIncome:()=>del('income',id,'income record'),
    addTithe:()=>titheForm(),editTithe:()=>titheForm(id),delTithe:()=>del('tithe',id,'tithe record'),
    addExpense:()=>expenseForm(),editExpense:()=>expenseForm(id),delExpense:()=>del('expenses',id,'expense'),
    closeModal,print:()=>window.print(),exportXlsx,exportJson,doImport,
    resetDash:()=>{ui.dash={year:'all',month:'all',week:'all',type:'all'};render()},
    saveSettings:()=>{DB.settings.church=document.getElementById('sChurch').value.trim()||'Church Finance';DB.settings.currency=document.getElementById('sCur').value.trim()||'GHS';DB.settings.openingBalance=r2(num(document.getElementById('sOpen').value));if(save()){render();toast('Settings saved')}},
    wipe:()=>{if(prompt('This deletes ALL records in this browser. Type DELETE to confirm.')==='DELETE'){DB.income=[];DB.tithe=[];DB.expenses=[];save();render();toast('All records deleted')}}
  })[b.dataset.act]?.();
});
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset||!t.dataset.f||t.tagName!=='INPUT')return;const [a,b]=t.dataset.f.split('.');ui[a][b]=t.value;const pos=t.selectionStart;render();const n=document.querySelector(`[data-f="${t.dataset.f}"]`);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}});
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset||!t.dataset.f||t.tagName!=='SELECT')return;const [a,b]=t.dataset.f.split('.');ui[a][b]=t.value;if(a==='dash'&&(b==='year'||b==='month'))ui.dash.week='all';render()});
document.getElementById('themeBtn').addEventListener('click',()=>{const r=document.documentElement,dark=getComputedStyle(r).getPropertyValue('--bg').trim()==='#14181a';r.dataset.theme=dark?'light':'dark';try{localStorage.setItem(KEY+'_theme',r.dataset.theme)}catch(e){}render()});
try{const t=localStorage.getItem(KEY+'_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
window.addEventListener('storage',e=>{if(e.key===KEY){DB=load();render()}});
/* ===== Login (screen lock) ===== */
const AUTHK=KEY+'_auth',FAILK=KEY+'_authfail';
const lockEl=document.getElementById('lock'),lockBox=document.getElementById('lockBox');
function getAuth(){try{return JSON.parse(localStorage.getItem(AUTHK))}catch(e){return null}}
function setAuth(a){try{localStorage.setItem(AUTHK,JSON.stringify(a));return true}catch(e){alert('Could not save the login in this browser.');return false}}
function getFail(){try{return JSON.parse(localStorage.getItem(FAILK))||{n:0,until:0}}catch(e){return {n:0,until:0}}}
function setFail(f){try{localStorage.setItem(FAILK,JSON.stringify(f))}catch(e){}}
function b64(buf){let s='';new Uint8Array(buf).forEach(b=>s+=String.fromCharCode(b));return btoa(s)}
async function hashPw(pw,salt){
  if(window.crypto&&crypto.subtle){const enc=new TextEncoder();const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:150000,hash:'SHA-256'},k,256))}
  let h=5381;const t=salt+'|'+pw;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return 'f'+h}
function newSalt(){const a=new Uint8Array(16);(window.crypto||{getRandomValues:x=>x.forEach((_,i)=>x[i]=Math.random()*256)}).getRandomValues(a);return b64(a)}
const sessOK=()=>{try{return sessionStorage.getItem(AUTHK+'_ok')==='1'}catch(e){return false}};
function setSess(v){try{v?sessionStorage.setItem(AUTHK+'_ok','1'):sessionStorage.removeItem(AUTHK+'_ok')}catch(e){}}
function lockHead(title,sub){return `<img src="${LOGO_FULL}" alt=""><h2>${esc(title)}</h2><p class="sub">${sub}</p>`}
function showLock(mode){
  const a=getAuth();document.documentElement.classList.add('locked');lockEl.classList.add('show');
  const church=esc(DB.settings.church||'Church Finance');
  if(mode==='setup'||mode==='change'){
    const ch=mode==='change';
    lockBox.innerHTML=lockHead(ch?'Change login':'Create your login',ch?'Enter your current password, then choose a new one.':`Protect ${church}'s records. You will use these details each time you open the app.`)+
    (ch?`<label>Current password</label><input type="password" id="lkOld" autocomplete="current-password">`:'')+
    `<label>Username</label><input type="text" id="lkUser" autocomplete="username" value="${esc(ch&&a?a.user:'')}">
     <label>${ch?'New password':'Password'} <span style="font-weight:400;color:var(--muted)">(at least 6 characters)</span></label><input type="password" id="lkPw" autocomplete="new-password">
     <label>Confirm password</label><input type="password" id="lkPw2" autocomplete="new-password">
     <div class="err" id="lkErr"></div><button class="btn primary" type="submit">${ch?'Save changes':'Create login'}</button>`+(ch?`<button type="button" class="lnk" id="lkCancel">Cancel</button>`:'');
    lockBox.onsubmit=async e=>{e.preventDefault();const err=document.getElementById('lkErr');
      const u=document.getElementById('lkUser').value.trim(),p=document.getElementById('lkPw').value,p2=document.getElementById('lkPw2').value;
      if(ch){const o=document.getElementById('lkOld').value;if(await hashPw(o,a.salt)!==a.hash){err.textContent='Current password is not correct.';return}}
      if(!u){err.textContent='Please enter a username.';return}
      if(p.length<6){err.textContent='Password must be at least 6 characters.';return}
      if(p!==p2){err.textContent='The two passwords do not match.';return}
      const salt=newSalt();const hash=await hashPw(p,salt);
      if(!setAuth({user:u,salt,hash,autolock:a?a.autolock:15}))return;
      setFail({n:0,until:0});setSess(true);unlock();if(ch)toast('Login updated')};
    const c=document.getElementById('lkCancel');if(c)c.onclick=()=>{ if(sessOK())unlock(); else showLock('login')};
    setTimeout(()=>{const f=document.getElementById(ch?'lkOld':'lkUser');f&&f.focus()},30);
  }else if(mode==='forgot'){
    lockBox.innerHTML=lockHead('Forgot password?','There is no way to recover a password, because the records are stored only in this browser. You can erase everything here and start again — or go back and try once more.')+
    `<p class="sub" style="color:#b3261e">If you have a backup (.json or .xlsx) you can import it again after resetting.</p>
     <label>Type ERASE to confirm</label><input type="text" id="lkConf" autocomplete="off"><div class="err" id="lkErr"></div>
     <button class="btn danger" type="submit">Erase all data and reset login</button><button type="button" class="lnk" id="lkBack">Back to log in</button>`;
    lockBox.onsubmit=e=>{e.preventDefault();if(document.getElementById('lkConf').value.trim().toUpperCase()!=='ERASE'){document.getElementById('lkErr').textContent='Type ERASE to confirm.';return}
      try{localStorage.removeItem(KEY);localStorage.removeItem(AUTHK);localStorage.removeItem(FAILK)}catch(e){}setSess(false);DB=load();showLock('setup')};
    document.getElementById('lkBack').onclick=()=>showLock('login');
  }else{
    lockBox.innerHTML=lockHead(DB.settings.church||'Church Finance','Log in to view the finance records.')+
    `<label>Username</label><input type="text" id="lkUser" autocomplete="username"><label>Password</label><input type="password" id="lkPw" autocomplete="current-password">
     <div class="err" id="lkErr"></div><button class="btn primary" type="submit" id="lkGo">Log in</button><button type="button" class="lnk" id="lkForgot">Forgot password?</button>`;
    lockBox.onsubmit=async e=>{e.preventDefault();const err=document.getElementById('lkErr'),f=getFail(),now=Date.now();
      if(f.until>now){err.textContent=`Too many attempts. Try again in ${Math.ceil((f.until-now)/1000)} seconds.`;return}
      const u=document.getElementById('lkUser').value.trim(),p=document.getElementById('lkPw').value;
      const ok=u.toLowerCase()===a.user.toLowerCase()&&await hashPw(p,a.salt)===a.hash;
      if(ok){setFail({n:0,until:0});setSess(true);unlock();return}
      f.n++;if(f.n>=5){f.until=now+Math.min(300,30*(f.n-4))*1000}setFail(f);
      err.textContent=f.until>now?`Too many attempts. Try again in ${Math.ceil((f.until-now)/1000)} seconds.`:'Username or password is not correct.';document.getElementById('lkPw').value='';document.getElementById('lkPw').focus()};
    document.getElementById('lkForgot').onclick=()=>showLock('forgot');
    setTimeout(()=>{const f=document.getElementById('lkUser');f&&f.focus()},30);
  }
}
function unlock(){document.documentElement.classList.remove('locked');lockEl.classList.remove('show');lockBox.innerHTML='';document.getElementById('logoutBtn').style.display='';resetIdle();render()}
function logout(){setSess(false);const b=document.getElementById('logoutBtn');b.style.display='none';showLock('login')}
let idleT=null;
function resetIdle(){clearTimeout(idleT);const a=getAuth();if(!a||!sessOK()||!a.autolock)return;idleT=setTimeout(logout,a.autolock*60000)}
['click','keydown','touchstart','scroll'].forEach(ev=>document.addEventListener(ev,()=>{if(sessOK())resetIdle()},{passive:true}));
document.getElementById('logoutBtn').addEventListener('click',logout);
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[data-sec]');if(!t)return;
  if(t.dataset.sec==='change')showLock('change');if(t.dataset.sec==='logout')logout()});
document.addEventListener('change',e=>{if(e.target.id==='sAuto'){const a=getAuth();if(a){a.autolock=+e.target.value;setAuth(a);resetIdle();toast('Auto log-out updated')}}});
function secCard(){const a=getAuth();if(!a)return '';
  return `<div class="card"><h3 style="margin-bottom:8px">Login &amp; security</h3><p class="help">Signed in as <b>${esc(a.user)}</b>. The login keeps other people from opening the app on this device.</p>
  <div class="form"><div class="full"><label>Log out automatically after</label><select id="sAuto">${[[5,'5 minutes'],[15,'15 minutes'],[30,'30 minutes'],[60,'1 hour'],[0,'Never']].map(([v,l])=>`<option value="${v}" ${a.autolock===v?'selected':''}>${l}</option>`).join('')}</select></div></div>
  <div class="row" style="margin-top:12px"><button class="btn" data-sec="change">Change username / password</button><button class="btn" data-sec="logout">Log out now</button></div></div>`}
(function initLogin(){const a=getAuth();
  if(!a){showLock('setup');return}
  if(sessOK()){document.getElementById('logoutBtn').style.display='';resetIdle();return}
  showLock('login')})();

render();
</script>
</body>
</html>
